name: Check Version Bump for Source Changes
on:
  pull_request:
    # labeled/unlabeled: the release:critical label changes the verdict, so adding it re-runs the
    # check without a push. edited: a base-branch change, such as retargeting onto release/*, does too.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

# A MERGE IS NOT A RELEASE (issue #220; fleet upgrade safety design §4.1/§4.2 in
# ali-fhr/studio.alissa.app docs/design/fleet-upgrade-safety.md). Until issue #220 this check
# required a version bump on every published change, so every merge was a release, and the Studio
# poll pinned each one within 15 minutes. On 2026-11-04 orcloop shipped twelve releases in one
# day, many of them review nits. Now the guard is inverted:
#
#   1. A pull request that changes a published path must ADD a line under `## Unreleased` in the
#      root CHANGELOG.md (this repo's only changelog). The release train (release-train.yaml,
#      16:00Z and 23:00Z) releases exactly what that section lists. A version-changing pull
#      request may write its line under its own `## <new version>` heading instead, and so may
#      any pull request based on a release/* branch.
#   2. Only a pull request from a `release/X.Y.Z` branch of THIS repository, where X.Y.Z equals
#      the new version, or one labelled `release:critical` (the operator's label; the reviewer
#      may recommend it) may change the version file.
#   3. A version change must name a version PyPI does not already have. The exception is a
#      release branch merged back into main whose `v<version>` tag already exists: that release
#      is already out, so the PyPI rule would refuse it, and the publish gate makes its merge a
#      no-op.
#
# The rules live in .github/scripts/release_train.py (`guard`), and the release-scripts job below
# runs their tests on every pull request.
#
# SCOPE of "published path": the whole distribution directory, which is the subtree
# package-publish.yaml triggers on, minus src/test/, plus docker/**, the subtree image-publish.yaml
# triggers on and builds. A change to requirements.txt, setup.py, README.md (long_description) or
# MANIFEST.in changes the wheel as much as a src/ change does, so it needs its changelog line too.
# Otherwise the train would ship it unannounced. Nothing under src/test/ is packaged. Repo-level
# paths (README.md, .github/, the *.sh check scripts) are outside both subtrees.
#
# SOURCE OF TRUTH: the plain-text `version` file, NOT the `version.py` beside it. setup.py reads
# `version` to set the distribution version. The Dockerfile's `ARG REVLOOP_VERSION` default is a
# second copy of the number, and the dockerfile-pin-sync job below fails any pull request on which
# it differs from the version file (issue #151). The train syncs it in the release pull request.

# Least privilege: the changed-file set and both changelogs come from git history, not from the
# pull-request API, so a read-only checkout is all this job ever needs. Labels come from the event
# payload.
permissions:
  contents: read

env:
  # PyPI JSON API root. Overridable so the guard can be dry-run against an
  # unreachable host to exercise the network-error path.
  PYPI_API_BASE: https://pypi.org/pypi

jobs:
  # The release helper's tests (the guard above, the publish gate, the train's cut, and the
  # release:critical flow in a throwaway repository). They need only the runner's python3.
  release-scripts:
    name: Release train helper tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
      - name: Run the release_train.py tests
        run: python3 -m unittest discover -v -s .github/scripts -p 'test_*.py'

  version-bump-check:
    strategy:
      matrix:
        # The distribution name on PyPI is the directory name, so `path` doubles
        # as the dist name. `version_file` is spelled out because the module path
        # under src/main is not derivable from the dist name.
        include:
          - path: alissa-tools-github-revloop
            version_file: alissa-tools-github-revloop/src/main/alissa/tools/github/revloop/version
            # The container image published from the same version (issue #151).
            image_prefix: docker/
    name: Version Bump Check for ${{ matrix.path }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          submodules: true
          # Full history: the diff below needs the merge base of the pull request.
          fetch-depth: 0
      - name: Compute Changed Files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit ${BASE_SHA} is missing from the local clone; fetching it."
            git fetch --no-tags origin "${BASE_SHA}"
          fi

          # Diff against the merge base (equivalent to BASE...HEAD), which is the
          # file set GitHub shows in the pull request's "Files changed" tab —
          # unrelated commits that landed on main meanwhile are not attributed
          # to this pull request.
          #
          # --no-renames: with rename detection on, a file moved OUT of the dist
          # directory is reported only at its destination, so the wheel changes
          # while the guard never sees a dist path. Without it, both sides of a
          # rename appear and the set is exactly "paths this pull request touches".
          merge_base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          changed="${RUNNER_TEMP}/changed-files.txt"
          git diff --no-renames --name-only "${merge_base}" "${HEAD_SHA}" > "${changed}"

          echo "changed_files=${changed}" >> "${GITHUB_OUTPUT}"
          echo "merge_base=${merge_base}" >> "${GITHUB_OUTPUT}"
          echo "Changed files in this pull request (${merge_base}..${HEAD_SHA}):"
          sed 's/^/  /' "${changed}"
      - name: Enforce the Changelog and Release-Branch Rules
        id: guard
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
          MERGE_BASE: ${{ steps.changes.outputs.merge_base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # A release/X.Y.Z branch counts only when it is a branch of this repository. A fork can
          # name its branch anything.
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # The whole dist directory (what package-publish.yaml triggers on)…
          DIST_PREFIX: ${{ matrix.path }}/
          # …except the tests, which are not packaged. See the SCOPE note above.
          TEST_PREFIX: ${{ matrix.path }}/src/test/
          # The container image's subtree (what image-publish.yaml triggers on and builds).
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
          VERSION_FILE: ${{ matrix.version_file }}
        run: |
          set -euo pipefail
          # The tags tell a merge-back of an already-published release (v<version> exists) from a
          # new release. The fetch-depth 0 checkout already brings them; fetching again makes the
          # dependency explicit, so a shallower checkout cannot silently lose them.
          git fetch --no-tags --quiet origin '+refs/tags/v*:refs/tags/v*' || echo "::warning::could not fetch release tags; a merge-back would be held to the PyPI-exists rule"
          python3 .github/scripts/release_train.py guard \
            --changed-files "${CHANGED_FILES}" \
            --base-sha "${MERGE_BASE}" --head-sha "${HEAD_SHA}" \
            --head-ref "${HEAD_REF}" --base-ref "${BASE_REF}" \
            --same-repo "${SAME_REPO}" --labels "${LABELS}" \
            --version-file "${VERSION_FILE}" --changelog CHANGELOG.md \
            --dist-prefix "${DIST_PREFIX}" --test-prefix "${TEST_PREFIX}" \
            --image-prefix "${IMAGE_PREFIX}"
      - name: Verify New Version Is Unpublished
        if: steps.guard.outputs.pypi_check == 'true'
        env:
          DIST_NAME: ${{ matrix.path }}
          VERSION_FILE: ${{ matrix.version_file }}
        run: |
          set -euo pipefail

          # A pull request can DELETE the version file, which reaches this step as
          # version_changed=true. Say so in the same shape as every other failure
          # here rather than dying on a bare `head: cannot open …`.
          if [ ! -f "${VERSION_FILE}" ]; then
            {
              echo "RULE: ${VERSION_FILE} must exist and hold the version this pull request publishes."
              echo ""
              echo "This pull request deletes (or moves away) ${VERSION_FILE}. setup.py opens that"
              echo "exact path to set the distribution version, so the merge-triggered publish would"
              echo "fail to build — and the version.py beside it would fall back to 0.0.0."
              echo ""
              echo "Fix: restore ${VERSION_FILE} holding the version this pull request publishes."
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "::error file=${VERSION_FILE}::${VERSION_FILE} is missing — setup.py reads it to set the published version. Restore it."
            exit 1
          fi

          version="$(head -n 1 "${VERSION_FILE}" | tr -d '[:space:]')"
          if [ -z "${version}" ]; then
            {
              echo "RULE: ${VERSION_FILE} must exist and hold the version this pull request publishes."
              echo ""
              echo "The file is empty. setup.py reads it to set the distribution version, so the"
              echo "merge-triggered publish would fail to build."
              echo ""
              echo "Fix: write the version this pull request publishes into ${VERSION_FILE}."
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "::error file=${VERSION_FILE}::${VERSION_FILE} is empty — it must hold the version this pull request publishes."
            exit 1
          fi
          case "${version}" in
            *[!A-Za-z0-9.+!_-]*)
              echo "::error file=${VERSION_FILE}::Version '${version}' contains characters that cannot appear in a PEP 440 version."
              exit 1
              ;;
          esac

          url="${PYPI_API_BASE}/${DIST_NAME}/${version}/json"
          echo "Asking PyPI whether ${DIST_NAME} ${version} already exists: ${url}"

          # A confirmed 200 is the only outcome that fails this step. Anything the
          # check cannot confirm — connection failure, timeout, 5xx, rate limit —
          # warns and passes: a PyPI outage must never block a merge.
          if http_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 3 "${url}")"; then
            case "${http_code}" in
              404)
                echo "::notice::${DIST_NAME} ${version} is not on PyPI (HTTP 404) — this pull request can publish it."
                ;;
              200)
                {
                  echo "RULE: the version in ${VERSION_FILE} must not already exist on PyPI."
                  echo ""
                  echo "${DIST_NAME} ${version} is ALREADY published (${url} responded HTTP 200)."
                  echo ""
                  echo "Why that blocks the merge: on merge, \"Python Package Publish\" uploads with"
                  echo "\`twine upload --skip-existing\`, which skips the duplicate and reports SUCCESS"
                  echo "while publishing nothing. main ends up ahead of PyPI with no signal — the"
                  echo "2026-07-28 alissa-github-develop-daemon incident (its PRs #62 and #64)."
                  echo ""
                  echo "Fix: bump ${VERSION_FILE} to a version PyPI does not have yet."
                } | tee -a "${GITHUB_STEP_SUMMARY}"
                echo "::error file=${VERSION_FILE}::${DIST_NAME} ${version} is already on PyPI — merging would make the publish a silent no-op (see the 2026-07-28 develop-daemon #62/#64 incident). Bump ${VERSION_FILE} again."
                exit 1
                ;;
              *)
                echo "::warning::PyPI answered HTTP ${http_code} for ${url}; could not confirm whether ${DIST_NAME} ${version} is already published. Passing — a PyPI outage must not block a merge."
                ;;
            esac
          else
            rc=$?
            echo "::warning::Could not reach PyPI (curl exited ${rc}) at ${url}; could not confirm whether ${DIST_NAME} ${version} is already published. Passing — a PyPI outage must not block a merge."
          fi

  # The Dockerfile's `ARG REVLOOP_VERSION` default is what a plain
  # `docker build` installs, and what check-entrypoint.yaml installs for its
  # library cross-check. It is the same number as the version file, spelled a
  # second time — and it drifted to 0.29.0 while the package reached 0.31.7
  # (issue #151). Now the two move together in the same pull request: this job
  # fails whenever they differ. It runs on EVERY pull request, not only on
  # ones that touch a published path, so a drift cannot ride in on an
  # unrelated change either.
  dockerfile-pin-sync:
    name: Dockerfile REVLOOP_VERSION default equals the version file
    runs-on: ubuntu-latest
    env:
      VERSION_FILE: alissa-tools-github-revloop/src/main/alissa/tools/github/revloop/version
      DOCKERFILE: docker/claude/Dockerfile
      VERSION_ARG: REVLOOP_VERSION
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Compare the ARG default with the version file
        run: |
          set -euo pipefail
          version="$(head -n 1 "${VERSION_FILE}" | tr -d '[:space:]')"
          # Exactly one uncommented `ARG REVLOOP_VERSION=<value>` line; the
          # same sed tests-image-contract.sh reads the pin with.
          pins="$(sed -n "s/^ARG ${VERSION_ARG}=\([^ ]*\).*/\1/p" "${DOCKERFILE}")"
          count="$(printf '%s\n' "${pins}" | grep -c . || true)"
          if [ "${count}" != "1" ]; then
            echo "::error file=${DOCKERFILE}::expected exactly one 'ARG ${VERSION_ARG}=<version>' line in ${DOCKERFILE}, found ${count}: ${pins:-<none>}"
            exit 1
          fi
          if [ "${pins}" != "${version}" ]; then
            {
              echo "RULE: the default of ARG ${VERSION_ARG} in ${DOCKERFILE} must equal ${VERSION_FILE}."
              echo ""
              echo "${DOCKERFILE} pins ${VERSION_ARG}=${pins}; ${VERSION_FILE} says ${version}."
              echo ""
              echo "Why that blocks the merge: a plain \`docker build\` installs the ARG default, so a"
              echo "stale default ships a daemon that cannot read the config this image renders, and"
              echo "the published image (image-publish.yaml) is built at the version file's value —"
              echo "the two copies of the number have to agree (issue #151; they sat at 0.29.0 vs 0.31.7)."
              echo ""
              echo "Fix: set 'ARG ${VERSION_ARG}=${version}' in ${DOCKERFILE} (bumping the version file"
              echo "means bumping the ARG in the same pull request). check-image.yaml builds the"
              echo "pull request's image from the newest PyPI release while this one is unpublished,"
              echo "so an unpublished pin does not break the pull request's checks."
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "::error file=${DOCKERFILE}::ARG ${VERSION_ARG}=${pins} differs from ${VERSION_FILE} (${version}) — set the ARG default to the version file's value (issue #151)."
            exit 1
          fi
          echo "::notice::${DOCKERFILE} pins ${VERSION_ARG}=${pins}, equal to ${VERSION_FILE}."
      # The docker CLI reads DOCKER_* variables (DOCKER_CONTEXT, DOCKER_HOST,
      # DOCKER_CONFIG, …) from the environment, so any such key in
      # image-publish.yaml's env blocks silently re-points every docker
      # command of the publish job. Nothing else runs that workflow before a
      # merge, so catch the name here: `DOCKER_CONTEXT: docker/claude` failed
      # every publish from this repo at its first `docker version` (issue #161;
      # ported from ali-fhr/alissa-dark-factory-orcloop PR #130).
      - name: image-publish.yaml declares no DOCKER_* env key
        env:
          PUBLISH_WORKFLOW: .github/workflows/image-publish.yaml
        run: |
          set -euo pipefail
          hits="$(grep -nE '^[[:space:]]*DOCKER_[A-Za-z0-9_]*[[:space:]]*:' "${PUBLISH_WORKFLOW}" || true)"
          if [ -n "${hits}" ]; then
            printf '%s\n' "${hits}"
            echo "::error file=${PUBLISH_WORKFLOW}::env keys starting with DOCKER_ are read by the docker CLI itself and break the publish job; rename them (e.g. BUILD_CONTEXT)."
            exit 1
          fi
          echo "::notice::${PUBLISH_WORKFLOW} declares no DOCKER_* env key."
