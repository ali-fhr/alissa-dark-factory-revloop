# Agent profiles for the alissa worker (~/.config/alissa/agents.yaml).
#
# The worker launches a reviewer with the profile named by ALISSA_AGENT_PROFILE
# (default: claude). Without this file the worker falls back to a bare `claude`,
# which stops on its first-run trust / permission prompt and hangs the reviewer.
#
# `--dangerously-skip-permissions` ALONE is what makes claude run unattended: it
# bypasses every permission prompt, so a headless session never stops to ask.
# It requires a non-root user (claude refuses that flag as root) — the image runs
# as uid 1000, which satisfies it. Reviewer posture (CR6: reviewers never write)
# is enforced by the round directive, not by this profile.
#
# Do NOT add an explicit `--permission-mode <mode>` next to the bypass flag. An
# explicit mode OVERRIDES the bypass: the session runs in that mode instead, and
# every hard prompt that mode does not auto-approve comes back — Claude Code's
# dangerous-rm check ("Dangerous rm operation on statically-unresolvable
# target"), un-allowlisted Bash, and the like. Nothing in a headless container
# answers those dialogs (the supervisor's `promptPatterns` below only detect and
# escalate), so each one is a permanent wedge: this profile shipped with
# `--permission-mode acceptEdits` alongside the bypass until 2026-09-03, and a
# reviewer sat at exactly that rm prompt for 7+ hours holding its slot while
# the queue re-delivered the same round (issue #116).
#
# EVEN SO, the bypass flag does not silence everything (issue #138, devloop
# #125): Claude Code's critical-path removal check — `rm`/`rmdir` on a glob, an
# unexpanded variable, a command substitution, `~`, `/`, the cwd or a parent of
# it — prompts in EVERY mode, and no allow rule or hook `allow` can approve it.
# It wedged studio lane #1358 twice on 2026-09-19 and a reviewer round on PR
# #808 (the sentinel's wedge corpus, `wedge-dialog:revloop:pr808-r10`). The
# answer is UPSTREAM of this profile: the PreToolUse hook
# /usr/local/share/alissa/hooks/guard-shell.py (registered into claude's
# settings.json by the entrypoint, ALISSA_SHELL_GUARD=off to disable) DENIES
# those shapes with an instructive reason before the dialog exists, the
# Notification hook note-waiting.py leaves a marker under
# ${ALISSA_WAITING_DIR:-/workspace/.waiting} for any prompt that still appears,
# and the daemon's prompt responder answers it within one poll from a policy
# table. The `promptPatterns` below stay as the last line of detection.
#
# To pin the reviewer model, set the ALISSA_AGENT_MODEL env var (default:
# claude-fable-5-1) — the entrypoint rewrites the `command:` below with
# `--model "$ALISSA_AGENT_MODEL"` at container boot (set it to `default` or empty
# to omit the flag and inherit the account default). To change flags instead,
# mount your own agents.yaml over this path at runtime; a mounted file lacks the
# `alissa-managed:` marker below and is used verbatim, so ALISSA_AGENT_MODEL
# does not touch it (your command wins).
#
# alissa-managed: the entrypoint regenerates the `command:` line of this default
# profile at boot from ALISSA_AGENT_MODEL — do not remove this marker line, it is
# what distinguishes the baked default from a runtime-mounted custom agents.yaml.
claude:
  command: claude --dangerously-skip-permissions
  mode: interactive
  quietSeconds: 30
  promptPatterns:
    - "Do you want to"
    - "❯ 1\\. Yes"
